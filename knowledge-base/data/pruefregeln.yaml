  - {id: S3-ALL-001, stufe: 3, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "UNA enthaelt genau sechs Trennzeichen - nur in Verfahren, die ein UNA-Segment vorsehen", gilt_nicht_fuer: [sgbxi-105]}
