# Prueferegelkatalog - maschinenlesbare Fassung von
# knowledge-base/50-anforderungen/02-validierungsregeln.md
#
# status:
#   spezifiziert  - Quelle verifiziert, implementierungsreif
#   entwurf       - Absicht klar, Detailvorgabe aus Sekundaerquelle
#   experimental  - Quelle nicht verifiziert, NICHT produktiv einsetzen
#
# schwere: FEHLER | WARNUNG | HINWEIS

schema_version: 1
stand: 2026-09-01

stufen:
  - {nr: 0, name: Dateipaerchen und Namenskonvention, fehlerklasse: transport}
  - {nr: 1, name: Auftragssatz, fehlerklasse: transport}
  - {nr: 2, name: Kryptografie, fehlerklasse: sicherheit}
  - {nr: 3, name: Syntax, fehlerklasse: syntax}
  - {nr: 4, name: Feldformate und Schluesselwerte, fehlerklasse: format}
  - {nr: 5, name: Referenzielle Integritaet und Summen, fehlerklasse: konsistenz}
  - {nr: 6, name: Fachliche Plausibilitaet, fehlerklasse: plausibilitaet}

abbruchsemantik: >-
  Schlaegt eine Stufe mit FEHLER fehl, werden alle hoeheren Stufen als
  "nicht geprueft" gekennzeichnet - niemals als "bestanden".

regeln:

  # --- Stufe 0 ---
  - {id: S0-ALL-001, stufe: 0, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "Zu jeder Nutzdatendatei existiert genau eine Auftragsdatei", quelle: "Anlage 1 GGT (KKS)"}
  - {id: S0-ALL-002, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Auftragsdatei traegt den Transferdateinamen der Nutzdatendatei plus Endung .AUF", quelle: "TA 1 Pflege, Anhang 3, Abschnitt 2.2.2"}
  - {id: S0-ALL-003, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Transferdateiname bei Nutzdaten- und Auftragsdatei identisch (8 Stellen bei § 105 SGB XI)", quelle: "TA 1 Pflege, Anhang 3, Abschnitt 2.2.2"}
  - {id: S0-ALL-004, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Stelle 1 des Transferdateinamens ist T (Test/Erprobung) oder E (Echtdaten)", quelle: "Anlage 4 GGT, Kapitel 1.3 bis 1.6"}
  - {id: S0-ALL-005, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Stellen 2-4 bilden eine bekannte Verfahrenskennung des jeweiligen Bereichs", quelle: "Anlage 4 GGT, Kapitel 1 und 3", werteliste: verfahrenskennungen.yaml}
  - {id: S0-ALL-006, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Stelle 5 ist eine Ziffer (Version des Verfahrens, beginnend mit 0)", quelle: "Anlage 4 GGT, Kapitel 1.3 bis 1.6"}
  - {id: S0-ALL-007, stufe: 0, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Stellen 6-8 sind numerisch (Transfernummer)", quelle: "Anlage 2 GGT, Feld TRANSFER_NUMMER"}
  - id: S0-ALL-008
    stufe: 0
    verfahren: ALL
    schwere: HINWEIS
    status: spezifiziert
    beschreibung: >-
      Wiederkehrende Transfernummer eines Absenders melden - aber NICHT als Fehler.
      Anlage 2 GGT schreibt ausdruecklich vor, dass die TRANSFER_NUMMER bei fehlerhafter
      Uebertragung erhalten bleibt und bei der Wiederholung wiederverwendet wird. Der
      Empfaenger muss das Dateipaar unter einem neuen systemeindeutigen Namen ablegen.
    quelle: "Anlage 2 GGT, Feld TRANSFER_NUMMER"
    korrektur_am: 2026-09-01
    korrektur_grund: >-
      Vorher als WARNUNG "Transfernummer noch nicht verwendet" gefuehrt. Das war falsch:
      Wiederholungen sind regelkonform.
  - {id: S0-ALL-009, stufe: 0, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "Datentraegerversand: alle Dateien im Wurzelverzeichnis, ISO-9660-Level-1-konforme Namen", quelle: "Anlage 14 GGT"}

  # --- Stufe 1 ---
  - {id: S1-ALL-001, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Auftragssatz ist genau 348 Byte lang und LAENGE_AUFTRAG traegt die Konstante 00000348", quelle: "Anlage 2 GGT, Felder LAENGE_AUFTRAG und VERSION"}
  - {id: S1-ALL-002, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "VERFAHREN_KENNUNG (Stellen 20-24) ist gueltig", quelle: "Anlage 2 GGT + Anlage 4 GGT", werteliste: verfahrenskennungen.yaml}
  - {id: S1-ALL-003, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "VERFAHREN_KENNUNG (Stellen 20-24) ist identisch mit den Stellen 1-5 des Transferdateinamens", quelle: "Anlage 2 GGT (Transferdateiname aus VERFAHREN_KENNUNG + TRANSFER_NUMMER); TA 1 Pflege, Anhang 3, Abschnitt 2.2.2"}
  - {id: S1-ALL-004, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "ABSENDER_EIGNER (Stellen 33-47) enthaelt eine gueltige Identifikation (IK 9-stellig, Absendernummer 8, KV-Identifikation 4 oder KZV-Nummer 5), linksbuendig mit Leerzeichen aufgefuellt", quelle: "Anlage 2 GGT, Feld ABSENDER_EIGNER"}
  - {id: S1-ALL-005, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "EMPFAENGER_NUTZER (63-77) und EMPFAENGER_PHYSIKALISCH (78-92) tragen eine Identifikation desselben Typs wie ABSENDER_EIGNER", quelle: "Anlage 2 GGT"}
  - {id: S1-ALL-006, stufe: 1, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "EMPFAENGER ist laut Kostentraegerdatei zustaendige Datenannahmestelle"}
  - {id: S1-ALL-007, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "TRANSFER_NUMMER (Stellen 25-27) ist identisch mit den Stellen 6-8 des Transferdateinamens", quelle: "Anlage 2 GGT; TA 1 Pflege, Anhang 3, Abschnitt 2.2.2"}
  - {id: S1-ALL-008, stufe: 1, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "Auftragssatz enthaelt keine Sozialdaten (Trennungsgebot)"}
  - {id: S1-ALL-009, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Alle Muss-Felder (M) des Auftragssatzes gefuellt; Kann-Felder (K) mit dem Default-Wert des Feldtyps belegt (N mit 0, A/AN mit Leerzeichen) - kein Nullbyte, keine Verkuerzung", quelle: "Anlage 2 GGT, Feldkatalog", werteliste: auftragssatz.yaml}
  - {id: S1-ALL-010, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "VERSCHLUESSELUNGSART (207-208) und ELEKTRONISCHE_UNTERSCHRIFT (209-210) tragen denselben Wert; zulaessig sind nur 00+00 und 03+03", quelle: "Anlage 2 GGT, Kombinationstabelle Kapitel 2.1"}
  - {id: S1-ALL-011, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "ZEICHENSATZ (203-204) aus der Werteliste I1/I5/I7/I8/EB/P8/U8/BI; im Datenaustausch nach § 294 ff. SGB V ist EB (EBCDIC) unzulaessig", quelle: "Anlage 2 GGT, Feld ZEICHENSATZ"}
  - {id: S1-ALL-012, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "DATEIGROESSE_NUTZDATEN (179-190) entspricht der tatsaechlichen Groesse der unverschluesselten, unkomprimierten Nutzdaten; DATEIGROESSE_UEBERTRAGUNG (191-202) der uebertragenen Groesse", quelle: "Anlage 2 GGT"}
  - {id: S1-ALL-013, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Konstantenfelder korrekt: IDENTIFIKATOR = 500000, DATEIVERSION = 000000, KORREKTUR = 0", quelle: "Anlage 2 GGT"}
  - {id: S1-ALL-014, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "KOMPRIMIERUNG (205-206) aus der Werteliste 00/02/03/07/13/23; 01, 04, 05 und 06 sind ausdruecklich nicht belegt", quelle: "Anlage 2 GGT, Feld KOMPRIMIERUNG"}
  - {id: S1-ALL-015, stufe: 1, verfahren: ALL, schwere: FEHLER, status: spezifiziert, beschreibung: "Bei DFUE tragen SATZFORMAT Leerzeichen, SATZLAENGE 00000 und BLOCKLAENGE 00000000; bei Bandverarbeitung sind alle drei Felder belegt", quelle: "Anlage 2 GGT, Kapitel 2.2"}
  - {id: S1-XI-001, stufe: 1, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "DATEINAME (105-115) entspricht dem logischen Dateinamen PL + MMJ + Art der Lieferung + lfd. Nr. + S|A + Kassenartenkennung", quelle: "TA 1 Pflege, Anhang 3, Abschnitt 2.2.1"}
  - {id: S1-XI-002, stufe: 1, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "DATEI_BEZEICHNUNG Stellen 319-320 tragen die Art der abgegebenen Leistung (Schluessel 2.4 der TA 3)", quelle: "TA 1 Pflege, Anhang 1, Abschnitt 4.1"}

  # --- Stufe 2 ---
  - {id: S2-ALL-001, stufe: 2, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "Nutzdatendatei ist wohlgeformtes PKCS#7/CMS", quelle: "Anlage 16 GGT"}
  - {id: S2-ALL-002, stufe: 2, verfahren: ALL, schwere: FEHLER, status: entwurf, beschreibung: "Aeusserer ContentType = EnvelopedData", quelle: "Anlage 16 GGT"}
