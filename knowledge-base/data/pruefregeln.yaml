  - {id: S3-XI-001, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "Datei enthaelt ausschliesslich die Nachrichtentypen PLGA und PLAA", quelle: "TA 1 Pflege, Abschnitt 4.4"}
  - {id: S3-XI-002, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "Kein UNA-Segment; Trennzeichen sind fest : + , ? und Apostroph, Dezimalzeichen ist das Komma", quelle: "TA 1 Pflege, Abschnitt 4.1 Absatz 10"}
  - {id: S3-XI-003, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "PLGA enthaelt die Segmente FKT REC SRD UST GES NAM in dieser Reihenfolge, jedes genau einmal; UST entfaellt in der Sammelrechnungs-PLGA", quelle: "TA 1 Pflege, Abschnitt 4.4.1"}
