  - {id: S3-XI-005, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "Auf eine PLGA folgt eine PLAA, ausser die PLGA ist als Sammelrechnung gekennzeichnet; auf eine Sammelrechnungs-PLGA folgt nur einmal eine PLGA", quelle: "TA 1 Pflege, Abschnitt 4.2 Absatz 6"}
  - {id: S3-XI-006, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "ESK-Segmente sind je Abrechnungsfall aufsteigend nach Kennzeichen der Leistungserbringung und Uhrzeit sortiert", quelle: "TA 1 Pflege, Abschnitt 4.4.2"}
  - {id: S3-XI-007, stufe: 3, verfahren: sgbxi-105, schwere: FEHLER, status: spezifiziert, beschreibung: "Nachrichtentypversion in UNH ist die zum Leistungsdatum gueltige (aktuell 6); PLGA und PLAA duerfen unterschiedliche Versionen tragen", quelle: "TA 1 Pflege, Abschnitte 4.4 und 4.5.1"}

