# Verfahrenskennungen (Feld VERFAHREN_KENNUNG, Stellen 20-24 des Auftragssatzes)
#
# Quelle: Anlage 4 zu den Gemeinsamen Grundsaetzen Technik nach § 95 SGB IV,
#         "Verfahrenskennungen", Version des Feldes 1.1,
#         gueltig ab 01.01.2026, Stand 06.11.2025, 47 Seiten.
#         https://www.gkv-datenaustausch.de/media/dokumente/standards_und_normen/
#         technische_spezifikationen/Anlage_4_-_Verfahrenskennungen.pdf
#
# Primaerdokument ausgewertet am 2026-09-01. Alle Eintraege: vertrauen = belegt.
#
# Abschnitt "bereiche": wortgetreue Uebernahme der Kapitel 1.3 bis 1.6 (Datenaustausch
# mit Leistungserbringern) - das ist der fuer den Validator relevante Teil.
# Abschnitt "verzeichnis": maschinell aus Kapitel 3 uebernommenes Gesamtverzeichnis
# aller Kennungen. Die Kapitel 1.1/1.2 und 1.7 bis 1.58 (Arbeitgeber, Rentenversicherung,
# GKV-intern) sind nur ueber das Verzeichnis abgedeckt.

schema_version: 1
stand: 2026-09-01
quelle:
  dokument: Anlage 4 GGT - Verfahrenskennungen
  version_feldbeschreibung: "1.1"
  gueltig_ab: 2026-01-01
  dokumentstand: 2025-11-06
  seiten: 47
  url: https://www.gkv-datenaustausch.de/media/dokumente/standards_und_normen/technische_spezifikationen/Anlage_4_-_Verfahrenskennungen.pdf
  vertrauen: belegt

# Aufbau der Kennung im Datenaustausch mit Leistungserbringern.
# Achtung: Dieses Schema gilt NICHT verfahrensuebergreifend. Im Datenaustausch mit der
# Rentenversicherung (Kapitel 1.2) sind die Kennungen zweistellig (z. B. "BK", "TR"),
# und die Verzeichniseintraege in Kapitel 3 sind 1-6 Stellen lang.
feldaufbau_leistungserbringer:
  laenge: 5
  position_im_auftragssatz: "20-24"
  stelle_20:
    bedeutung: Test-/Echtkennzeichen
    werte:
      E: Echtdaten
      T: Testdaten (und Erprobungsverfahren)
  stellen_21_23:
    bedeutung: Verfahren (dreistelliges Kuerzel, s. bereiche)
  stelle_24:
    bedeutung: Ziffer fuer die Version des Verfahrens, beginnend mit 0
    format: "[0-9]"

bereiche:

  # Kapitel 1.3
  sgbv-294ff:
    titel: Datenaustausch zwischen Leistungserbringern und Krankenkassen nach § 294 ff. SGB V
    kapitel: "1.3"
    richtung: LE -> GKV
    kuerzel:
      - {abk: KAV, beschreibung: fuer Kassenaerztliche Vereinigungen}
      - {abk: KZV, beschreibung: fuer Kassenzahnaerztliche Vereinigungen}
      - {abk: APO, beschreibung: fuer Apotheken}
      - {abk: IMG, beschreibung: fuer die Imagedaten nach § 7 der Vereinbarung nach § 300 SGB V}
      - {abk: KRH, beschreibung: fuer Krankenhaeuser}
      - {abk: REH, beschreibung: fuer Reha-Einrichtungen}
      - {abk: SOL, beschreibung: fuer Sonstige Leistungserbringer}
      - {abk: EBZ, beschreibung: fuer das Elektronische Beantragungs- und Genehmigungsverfahren Zahnaerzte, richtung: Zahnaerzte -> GKV}
      - {abk: GKH, beschreibung: Grundsatz-Datenaustausch zwischen Krankenhaeusern und Krankenkassen}

  # Kapitel 1.4
  sgbv-295-1b:
    titel: Datenaustausch zwischen Leistungserbringern und Krankenkassen nach § 295 Abs. 1b SGB V (Direktabrechner)
    kapitel: "1.4"
    richtung: LE -> GKV
    konvention: >-
      Fuer alle Selektivvertraege sind die Stellen 21-22 mit "DR" zu belegen; die weitere
      Spezifizierung erfolgt in Stelle 23 (Buchstaben A-Z).
    kuerzel:
      - {abk: DIR, beschreibung: "fuer Direktabrechner (Technische Anlage 1.0; galt fuer bestehende Verfahren uebergangsweise bis Ende 2011)"}
      - {abk: DRB, beschreibung: "fuer hausarztzentrierte Versorgung (Technische Anlage ab Version 2.0)"}
      - {abk: DRC, beschreibung: "fuer besondere aerztlich ambulante Versorgung (Technische Anlage ab Version 2.0)"}
      - {abk: DRI, beschreibung: "Integrierte Versorgung (Technische Anlage 3.0)"}
      - {abk: DRM, beschreibung: Modellvorhaben nach § 64d SGB V}
      - {abk: DRS, beschreibung: Vertraege nach § 132e und § 132f SGB V}

  # Kapitel 1.5
  sgbxi-105:
    titel: Datenaustausch zwischen Leistungserbringern und Pflegekassen nach § 105 SGB XI
    kapitel: "1.5"
    richtung: LE -> GKV
    kuerzel:
      - {abk: PFL, beschreibung: Datenaustausch nach § 105 SGB XI}
      - {abk: PFU, beschreibung: Uebermittlung elektronischer Urbeleg nach § 105 Abs. 2 SGB XI}
    beispiele: [EPFL0, TPFL0]

  # Kapitel 1.6
  versichertenkarten:
    titel: Datenuebertragung mit Erstellern von Versichertenkarten
    kapitel: "1.6"
    richtung: GKV -> Personalisierer
    kuerzel:
      - {abk: KVK, beschreibung: fuer Krankenversichertenkarte}

# Feld VERFAHREN_KENNUNG_SPEZIFIKATION (Stellen 28-32 des Auftragssatzes), Kapitel 2.
# Die Werte werden eindeutig je Verfahren festgelegt (z. B. der Nachrichtentyp, sofern
# eindeutig pro Lieferung). Das Feld kann auch die Verarbeitungsprioritaet ausdruecken.
# Es gibt KEINE verfahrensuebergreifende Werteliste; Anlage 4 nennt nur Beispiele und
# haelt fest, dass diese Listen nicht fortgeschrieben werden.
verfahren_kennung_spezifikation:
  kapitel: "2"
  fortschreibung: nein
  beispiele:
    amtliche_statistiken: [KM1, KM6, KG1, KG2, KG3, KG4, KG5, KG8, KV451, KV452, KJ1, KJ2,
                           SGB1K, SGB1P, PG1, PG2, PG4, PG5, PV45, PJ1]
    bas_mrs: [MR100, MR111, MR400, MR500, MR600, MR610, MR700]
    gkv_sv_pqd_pqv: [UPDT, VOLL]
  hinweis_pflege: >-
    Im Datenaustausch nach § 105 SGB XI wird das Feld laut Anhang 1 der Technischen
    Anlage 1 nicht belegt; die Art der abgegebenen Leistung steht dort stattdessen in
    DATEI_BEZEICHNUNG, Stellen 319-320.

