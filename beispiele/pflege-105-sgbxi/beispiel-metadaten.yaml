# Beschaeftigtennummern nach § 293 Abs. 8 Satz 2 SGB V
beschaeftigtennummern:
  verwendet: [999999998, 999999996]
  quelle: TA 3, Schluessel 2.17 (Ersatz-Beschaeftigtennummer)
  bedeutung:
    "999999998": neue(r) Beschaeftigte(r) ohne Beschaeftigtennummer
    "999999997": Beschaeftigtennummer fehlt aus sonstigem Grund
    "999999996": Auszubildende(r) ohne Beschaeftigtennummer
  hinweis: >-
    Das Beispiel verwendet ausschliesslich die in Schluessel 2.17 definierten
    Ersatzwerte. Vergabe und Pruefverfahren echter Beschaeftigtennummern sind in dieser
    Wissensbibliothek nicht erfasst; eine erfundene neunstellige Nummer wuerde eine
    Formatzusage machen, die nicht belegt ist.

