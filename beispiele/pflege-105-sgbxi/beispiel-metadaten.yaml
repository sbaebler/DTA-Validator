# Maschinenlesbare Beschreibung des Beispiel-Dateipaerchens TPFL0001 / TPFL0001.AUF
#
# Zweck: Erwartungswerte fuer Parser- und Regeltests, ohne die Beispieldateien
# selbst parsen zu muessen. Feldkonventionen wie in knowledge-base/data/README.md:
#   vertrauen: belegt | sekundaer | offen
#
# Stand 01.09.2026: Struktur und Feldbelegung sind gegen die Primaerdokumente
# gebaut - TA 1 (Pflege) V 6.4.0, TA 3 V 6.4.0, TA 1 Anhang 1 V 2.0,
# TA 1 Anhang 3 V 2.1.2, Anlage 2 GGT (Auftragssatz V 1.0), Anlage 4 GGT.
# ERFUNDEN sind nur die Stammdaten (Namen, Anschriften, IK, KVNR, Preise,
# Leistungskomplexnummern) und der Sachverhalt selbst.

schema_version: 2
stand: 2026-09-01

beispiel:
  id: pflege-105-sgbxi-001
  bezeichnung: Monatsabrechnung eines ambulanten Pflegedienstes, zwei Abrechnungsfaelle
  verfahren: sgbxi-105
  art: positivfall
  vertrauen: belegt
  hinweis: >-
    Transportrahmen und Nutzdatenstruktur folgen den ausgewerteten Primaerdokumenten.
    Die Stammdaten sind synthetisch. Preise und Leistungskomplexnummern stammen aus
    keiner realen Verguetungsvereinbarung - sie sind formal gueltig (Schluessel 2.7.1:
    3 Stellen alphanumerisch), inhaltlich aber frei gewaehlt.
  synthetisch: true
  enthaelt_sozialdaten: false
  regelwerk:
    ta1_version: 6.4.0
    ta1_gueltig_ab: 2026-05-01
    ta3_version: 6.4.0
    anhang1_version: "2.0"
    anhang3_version: 2.1.2
    auftragssatz_version: "1.0"
    hinweis_nachfolger: >-
      Ab 01.02.2027 gilt TA 1 6.5.1. Dort entfaellt das IMG-Segment aus PLAA und die
      TI-Strecke wandert in die neue Technische Anlage 5. Dieses Beispiel nutzt kein
      IMG-Segment und bleibt insoweit auch unter 6.5.1 gueltig.

dateien:
  nutzdaten:
    name: TPFL0001
    groesse_bytes: 4924
    verschluesselt: false
    hinweis: >-
      Real waere dies der SECON-Umschlag (EnvelopedData ueber SignedData nach
      Anlage 16 GGT). Hier liegt der Klartext unter dem Dateinamen, damit die Fixture
      ohne Schluesselmaterial nutzbar ist. Pruefstufe 2 ist mit diesem Beispiel nicht
      testbar. Der Auftragssatz weist die Datei konsistent als unverschluesselt aus
      (VERSCHLUESSELUNGSART und ELEKTRONISCHE_UNTERSCHRIFT beide "00" - eine der zwei
      zulaessigen Kombinationen).
    zeilenumbrueche: false
    zeichensatz: iso-8859-1
    zeichensatz_hinweis: >-
      Anhang 1 der TA 1 laesst ISO 8859-1, ISO 7-Bit (DIN 66003 DRV 7) und ISO 8-Bit
      (DIN 66303 DRV 8) zu; der Auftragssatz deklariert I1 = ISO 8859-1. Die Datei
      enthaelt nur Zeichen, die in allen drei Kodierungen byte-identisch sind.
  auftragsdatei:
    name: TPFL0001.AUF
    groesse_bytes: 348
    format: festsatz
    satzlaenge: 348
    satzlaenge_vertrauen: belegt
    satzlaenge_quelle: Anlage 2 GGT, Feld LAENGE_AUFTRAG (Konstante 00000348 bei VERSION 01)
    zeichensatz: iso-8859-1
  urbeleg_begleitzettel:
    name: urbeleg-begleitzettel.html
    art: Begleitzettel fuer Urbelege
    seiten: 1
    vertrauen: offen
    hinweis: >-
      Aufbau erfunden. Anlage 4 zur TA 1 (Pflege) "Begleitzettel fuer Urbelege" V 1.0
      vom 31.01.2003 existiert und ist im Dokumentenregister erfasst, aber noch nicht
      ausgewertet.
    adressat: belegannahmestelle
    verknuepfungsmerkmale: [rechnungsnummer, dateiname, transfernummer]
  urbeleg:
    name: urbeleg-leistungsnachweis.html
    art: Leistungsnachweis ambulante Pflege
    seiten: 2
    vertrauen: offen
    hinweis: >-
      Aufbau erfunden. Fuer den ELEKTRONISCHEN Leistungsnachweis ist die Struktur in
      TA 1 Abschnitt 4.6.2 (Schema PFL_LNW_2.2.0.xsd) belegt; fuer den papiergebundenen
      Beleg ist kein Dokument ausgewertet.
    weg: Belegannahmestelle laut Kostentraegerdatei, nicht Datenannahmestelle
    zeichensatz: utf-8
    zeichensatz_hinweis: >-
      Der Papierbeleg traegt korrekte deutsche Rechtschreibung mit Umlauten; die
      Nutzdatendatei kommt in diesem Beispiel ohne Umlaute aus. Ein Feldvergleich
      zwischen beiden Welten darf nicht zeichenweise erfolgen.

