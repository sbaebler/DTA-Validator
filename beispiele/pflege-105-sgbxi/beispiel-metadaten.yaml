    name: TPLG0001.AUF
    groesse_bytes: 128
    format: festsatz
    satzlaenge_vertrauen: offen
    satzlaenge_hinweis: >-
      128 ist ein Platzhalter. Die echte Satzlaenge steht in Anlage 2 GGT und ist
      nicht bekannt.

