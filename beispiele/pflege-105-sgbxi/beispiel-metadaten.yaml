    ik_regionalbereich: "95"
    rolle: Kasse des Leistungs-/Bewilligungsbescheids
    hinweis: >-
      PLGA.FKT.IK der Pflegekasse beginnt laut TA 1 immer mit "18". Kostentraeger und
      Pflegekasse teilen hier Regionalbereich und Seriennummer und unterscheiden sich
      nur in der Klassifikation - weil die Pruefziffer nur aus den Stellen 3-8 gebildet
      wird, ist sie bei beiden IK dieselbe.

