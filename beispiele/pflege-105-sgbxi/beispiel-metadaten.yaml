# Erwartungswerte fuer die Syntaxpruefung (Stufe 3)
struktur:
  trennzeichen:
    komponente: ":"
    datenelement: "+"
    dezimal: ","
    aufhebung: "?"
    segmentende: "'"
    una_segment: nein
    vertrauen: belegt
    quelle: TA 1 Abschnitt 4.1 Absatz 10
    hinweis: >-
      Die TA 1 legt die Trennzeichen fest; ein UNA-Segment ist nicht vorgesehen. Das
      Dezimalzeichen ist das Komma, nicht der EDIFACT-Default-Punkt.
  segmente_gesamt: 163
  nachrichten: 2
  datenaustauschreferenz: "1"
  dateiindikator: "0"               # 0 = Testdatei, 1 = Erprobung, 2 = Echtdaten
  nachrichten_details:
    - {referenz: "1", typ: PLGA, version: "6", segmente: 8}
    - {referenz: "2", typ: PLAA, version: "6", segmente: 153}
  segmentfolge_plga: [FKT, REC, SRD, UST, GES, NAM]
  segmentfolge_plaa_je_abrechnungsfall: [INV, NAD, MAN, "ESK (1-n)", "ELS (1-n je ESK)", IAF]
  kardinalitaeten:
    PLGA: {FKT: 1, REC: 1, SRD: 1, UST: "0-1", GES: 1, NAM: 1}
    PLAA: {FKT: 1, REC: 1, INV: "1-n", NAD: "1 je INV", IMG: "0-n je INV",
           MAN: "1 je INV", ESK: "1-n je MAN", ELS: "1-n je ESK",
           ZUS: "0-n je ELS", HIL: "0-1 je ELS", IAF: "1 je INV"}
  segmentherkunft_vertrauen: belegt
  quelle_struktur: TA 1 Abschnitte 4.3 bis 4.5

