    zeichensatz: ascii
    zeichensatz_hinweis: >-
      Umlaute und ss durchgaengig transliteriert. Der zulaessige Zeichensatz fuer
      § 105 SGB XI ist nicht belegt; ASCII ist unter allen in Frage kommenden
      Kodierungen byte-identisch.
